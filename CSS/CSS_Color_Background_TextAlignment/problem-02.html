<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Special Menu</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: rgb(250, 245, 235);">

    <header style="background-color: red; color: white; text-align: center; padding: 15px 0;">
        <h1 style="margin: 0; font-size: 28px;">Tasty Bites Restaurant</h1>
        <p style="margin: 5px 0 0 0; font-size: 14px; font-style: italic;">Good Food Makes a Better Mood</p>
    </header>

    <main style="padding: 20px; text-align: center;">
        <h2 style="text-align: center; color: brown; margin-bottom: 20px;">Our Special Dishes</h2>

        <table style="width: 80%; margin: 0 auto; border-collapse: collapse; background-color: white;">
            <thead>
                <tr style="background-color: yellow; color: white;">
                    <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Dish Name</th>
                    <th style="padding: 10px; border: 1px solid #ddd; text-align: center;">Type</th>
                    <th style="padding: 10px; border: 1px solid #ddd; text-align: right;">Price</th>
                </tr>
            </thead>
            <tbody>
                <tr style="background-color: rgb(255, 255, 255);">
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: left; color: black;">Margherita Pizza</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: center; color: green;">Veg</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right; color: black;">₹249</td>
                </tr>
                <tr style="background-color: rgb(245, 245, 245);">
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: left; color: black;">Paneer Butter Masala</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: center; color: green;">Veg</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right; color: black;">₹279</td>
                </tr>
                <tr style="background-color: rgb(255, 255, 255);">
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: left; color: black;">Chicken Biryani</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: center; color: red;">Non-Veg</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right; color: black;">₹299</td>
                </tr>
                <tr style="background-color: rgb(245, 245, 245);">
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: left; color: black;">Chocolate Brownie</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: center; color: purple;">Dessert</td>
                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right; color: black;">₹149</td>
                </tr>
            </tbody>
        </table>

        <div style="background-color: rgb(255, 220, 230); color: maroon; text-align: center; padding: 12px; margin: 25px auto 0 auto; width: 80%; font-weight: bold; font-size: 18px;">
            Visit Us and Enjoy Delicious Food!
        </div>
    </main>

    <footer style="background-color: black; color: white; padding: 12px 20px; overflow: hidden;">
        <span style="float: left; text-align: left;">Open Daily: 11 AM - 11 PM</span>
        <span style="float: right; text-align: right;">Thank You!</span>
    </footer>

</body>
</html>
